<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#171f1a"><title>Pixel 8 Direções</title><style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141c17;font-family:system-ui,sans-serif;color:#f4f1df}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;padding:14px 16px;pointer-events:none;text-shadow:1px 2px #151c16;font-size:12px;letter-spacing:1px}.hud b{display:block;font-size:15px;color:#f1e2b6}.hud small{color:#c9c5aa}.controls{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom,0px));left:22px;display:flex;align-items:end;gap:22px}.stick{width:138px;height:138px;border:2px solid #aab79c66;border-radius:50%;background:#18291e99;position:relative;box-shadow:inset 0 0 0 22px #263b2b40}.knob{position:absolute;width:58px;height:58px;left:38px;top:38px;border-radius:50%;background:#b2c4a9a8;border:3px solid #e2e8ce9e;box-shadow:0 3px 12px #0007}.run{height:76px;width:76px;margin-bottom:30px;border-radius:50%;border:2px solid #e6d8aa88;background:#7a6248aa;color:#fff0d2;font-size:12px;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 15px #0007}.run.active{background:#b78b4f;border-color:#fff0bd;transform:scale(.96)}.tip{position:fixed;bottom:12px;right:14px;font-size:11px;color:#f6e9c9aa;text-align:right;pointer-events:none}@media(max-width:400px){.stick{width:116px;height:116px}.knob{left:29px;top:29px}.controls{gap:14px;left:14px}.run{width:70px;height:70px;margin-bottom:22px}.tip{font-size:9px}}
</style></head><body><canvas id="game"></canvas><div class="hud"><div><b>CAMPO DE TESTE</b><small>8 direções · visão elevada</small></div><div id="status">PARADO</div></div><div class="controls"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><button id="run" class="run">CORRER</button></div><div class="tip">Mova o analógico · Segure CORRER</div><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const sprites={};for(const a of ['idle','walk','run']){sprites[a]=[];for(let i=0;i<8;i++){let im=new Image();im.src=`sprites/${a}_${i}.png`;sprites[a].push(im)}}
const TILE=64,MW=36,MH=36;let player={x:MW*TILE/2,y:MH*TILE/2,dir:4,step:0},joy={x:0,y:0},running=false,activePointer=null,keys={};const stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),run=document.querySelector('#run');
function stickMove(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,len=Math.hypot(dx,dy)||1,amt=Math.min(1,len/max);joy.x=dx/len*amt;joy.y=dy/len*amt;knob.style.transform=`translate(${joy.x*max}px,${joy.y*max}px)`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();activePointer=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)stickMove(e)});function endStick(e){if(e.pointerId!==activePointer)return;activePointer=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
run.addEventListener('pointerdown',e=>{e.preventDefault();run.setPointerCapture(e.pointerId);running=true;run.classList.add('active')});for(let ev of ['pointerup','pointercancel','lostpointercapture'])run.addEventListener(ev,()=>{running=false;run.classList.remove('active')});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function hash(x,y){let z=Math.sin(x*127.1+y*311.7)*43758.5453;return z-Math.floor(z)}function blocked(x,y){let tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);if(tx<1||ty<1||tx>=MW-1||ty>=MH-1)return true;let v=hash(tx,ty);return v>.965 && Math.abs(tx-18)+Math.abs(ty-18)>4}
function drawWorld(camX,camY){let sx=Math.max(0,Math.floor(camX/TILE)-1),sy=Math.max(0,Math.floor(camY/TILE)-1),ex=Math.min(MW,Math.ceil((camX+W)/TILE)+1),ey=Math.min(MH,Math.ceil((camY+H)/TILE)+1);for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){let px=Math.round(x*TILE-camX),py=Math.round(y*TILE-camY),n=hash(x,y);ctx.fillStyle=n<.2?'#354a35':n<.55?'#3b5039':'#40543b';ctx.fillRect(px,py,TILE+1,TILE+1);ctx.fillStyle='#5b6942';for(let j=0;j<4;j++){let rx=hash(x*9+j,y*7+j)*TILE,ry=hash(x*11+j,y*13+j)*TILE;ctx.fillRect(px+rx,py+ry,3,7)}if(n>.82&&n<.95){ctx.fillStyle='#665e45';ctx.fillRect(px+12,py+18,25,17);ctx.fillStyle='#8b7b59';ctx.fillRect(px+12,py+18,23,5)}if(blocked(x*TILE+32,y*TILE+32)){ctx.fillStyle='#1d3025';ctx.beginPath();ctx.ellipse(px+33,py+46,27,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#233b2b';ctx.fillRect(px+27,py+24,13,26);for(let k=0;k<3;k++){ctx.fillStyle=['#243f2b','#2e5033','#3b5b39'][k];ctx.beginPath();ctx.arc(px+31+(k-1)*10,py+17+(k%2)*7,18,0,Math.PI*2);ctx.fill()}}}}
function dirFor(x,y){let a=Math.atan2(y,x);return [2,3,4,5,6,7,0,1][((Math.round((a+Math.PI/2)/(Math.PI/4))%8)+8)%8]}
// world movement: screen down means character faces viewer (column 0)
function spriteDirection(x,y){let angle=Math.atan2(y,x);let sectors=[2,1,0,7,6,5,4,3];return sectors[((Math.round(angle/(Math.PI/4))%8)+8)%8]}
let last=performance.now();function frame(t){let dt=Math.min((t-last)/1000,.04);last=t;let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),mag=Math.hypot(dx,dy),moving=mag>.08,fast=running||keys.shift;let state=moving?(fast?'run':'walk'):'idle';if(moving){dx/=Math.max(1,mag);dy/=Math.max(1,mag);player.dir=spriteDirection(dx,dy);let speed=fast?205:105;let nx=player.x+dx*speed*dt,ny=player.y+dy*speed*dt;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;player.step+=dt*(fast?14:8)}else player.step=0;
let camX=Math.max(0,Math.min(MW*TILE-W,player.x-W/2)),camY=Math.max(0,Math.min(MH*TILE-H,player.y-H*.53));ctx.clearRect(0,0,W,H);drawWorld(camX,camY);let px=player.x-camX,py=player.y-camY;ctx.fillStyle='#15261b99';ctx.beginPath();ctx.ellipse(px,py+9,22,9,0,0,Math.PI*2);ctx.fill();let im=sprites[state][player.dir],bounce=moving?Math.abs(Math.sin(player.step))*4:Math.sin(t*.002)*1.2;let sh=108,sw=sh*.61;if(im.complete&&im.naturalWidth)ctx.drawImage(im,Math.round(px-sw/2),Math.round(py-sh+12-bounce),sw,sh);else{ctx.fillStyle='#e1a278';ctx.fillRect(px-12,py-56,24,48)}document.querySelector('#status').textContent=state==='idle'?'PARADO':state==='walk'?'ANDANDO':'CORRENDO';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
